

name: Build Galaxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: galaxy-project/galaxy-live-wallpapers
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: galaxy-project/galaxy-live-wallpapers/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Prepare Android
        run: npx cap sync android

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-S26-APK
          path: galaxy-project/galaxy-live-wallpapers/android/app/build/outputs/apk/debug/app-debug.apk
